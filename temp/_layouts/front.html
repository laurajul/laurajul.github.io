<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title | default: "Home" }}</title>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="{{ '/css/styles.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/chota.min.css' | relative_url }}">

  <!-- Scripts -->
  <script src="{{ '/js/image_reveal.js' | relative_url }}" defer></script>
  <script src="{{ '/js/cursor_trail.js' | relative_url }}" defer></script>
  <script src="{{ '/js/deactivate_header.js' | relative_url }}" defer></script>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg">
  <link rel="icon" type="image/png" href="/assets/favicon/favicon.png" sizes="32x32">


  <style>
    html { scroll-behavior: smooth; }
  </style>
</head>

<body>

  <!-- Scrolling Banner -->
 <!-- Scrolling Banner -->



  <!--
  <div id="loading-screen">
  <div class="loading-text">Loading...</div> -->
</div>

    <div class="scrolling-banner" id="scrollingBanner">
    <div class="scrolling-wrapper">
      <div class="scrolling-text">
        <img src="/assets/favicon/favicon.svg" alt="Icon" width="24" height="24" style="vertical-align: middle;"> CALL FOR PAPERS Open Now – Submit by August 12, 2025 <img src="/assets/favicon/favicon.svg" alt="Icon" width="24" height="24" style="vertical-align: middle;">


      </div>
    </div>
  </div>
  <!-- Navigation -->
  <nav class="main-nav">
    <a href="#call">Call for Papers</a>
    <a href="#about">About</a>
    <!-- <a href="#program">Program</a> -->
    <a href="#registration">Registration</a>
  </nav>

  <!-- Hero Header -->
  <header class="hero-header">
    {% include header.html %}
  </header>

  <!-- Main Content -->
  <main>
    {{ content }}
  </main>

  <!-- Footer -->
  {% include footer.html %}

  <!-- Custom Cursor -->
  <div id="custom-cursor"></div>

  <script>
  window.addEventListener('load', () => {
    const loading = document.getElementById('loading-screen');
    if (!loading) return;

    // Wait 1 second after full load
    setTimeout(() => {
      loading.classList.add('fade-out');

      // Remove from DOM after fade transition
      setTimeout(() => {
        loading.remove();
      }, 400); // Match CSS transition duration
    }, 100);
  });
</script>

</body>
</html>
